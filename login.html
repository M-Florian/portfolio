<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Retrix - Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0a0a0a;
      color: #f4f4f4;
      margin: 0; padding: 0;
    }
    header {
      background: #111111;
      color: #a020f0;
      padding: 15px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
    }
    nav {
      background: #1a1a1a;
      padding: 10px;
      text-align: center;
    }
    nav a {
      color: #f4f4f4;
      margin: 0 10px;
      text-decoration: none;
    }
    nav a:hover { color: #a020f0; }
    .container {
      width: 300px;
      margin: 100px auto;
      padding: 25px;
      background: #111111;
      border: 1px solid #2a2a2a;
      border-radius: 5px;
      text-align: center;
    }
    input {
      width: 100%; padding: 12px; margin: 10px 0;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      background: #1a1a1a;
      color: #f4f4f4;
    }
    button {
      width: 100%; padding: 12px;
      background: #a020f0;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 10px;
      font-weight: bold;
    }
    button:hover { background: #7a1ac7; }
  </style>
</head>
<body>
  <header>Retrix</header>
  <nav>
    <a href="index.html">Start</a>
    <a href="login.html">Login</a>
    <a href="contact.html">Kontakt</a>
  </nav>

  <div class="container">
    <h2>Login</h2>
    <form>
      <input type="text" placeholder="Benutzername" required>
      <input type="password" placeholder="Passwort" required>
      <button type="submit">Einloggen</button>
    </form>
  </div>
</body>
</html>
